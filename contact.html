<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Crazyland</title>
  <meta name="description" content="Crazyland contact page.">
  <meta name="contact-api-url" content="https://truthful-analysis-production.up.railway.app/api/contact">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">C</span>
        <span class="brand-copy">
          <strong>Crazyland</strong>
          <small>Portfolio</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="comics.html">Comics</a>
        <a href="commissions.html">Commissions</a>
        <a href="community.html">Community</a>
        <a class="current" href="contact.html">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="audio-toggle" type="button" aria-pressed="false">Sound On</button>
        <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Dark Mode"></button>
      </div>
    </header>

    <main class="contact-page">
      <section class="contact-page-card page-transition-target" aria-label="Contact form">
        <div class="contact-page-copy">
          <h1>Contact</h1>
          <p>Log in with Discord first, then send a message here and the bot will forward it.</p>
          <p>I will reply back through the bot to the Discord account you used to log in.</p>
        </div>

        <div class="contact-auth-card">
          <p class="contact-auth-status" aria-live="polite">Checking login...</p>
          <div class="contact-auth-actions">
            <button class="button" type="button" data-discord-login>Log In With Discord</button>
            <button class="button" type="button" data-discord-logout hidden>Log Out</button>
          </div>
        </div>

        <form class="contact-form" data-contact-endpoint autocomplete="off" hidden>
          <label>
            Name
            <input type="text" name="name" placeholder="Your name" autocomplete="off" spellcheck="false">
          </label>
          <label class="full-width">
            Message
            <textarea
              name="message"
              rows="6"
              placeholder="Write your message here."
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
            ></textarea>
          </label>
          <button class="button" type="submit">Send Message</button>
          <p class="form-note" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </div>

  <audio class="background-audio" loop preload="auto">
    <source src="ambient-field-day.mp3" type="audio/mpeg">
  </audio>
  <script src="script.js"></script>
</body>
</html>
